<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ "/layouts/custom.css" | relative_url }}" />
  <link rel="stylesheet" href="{{ "/assets/css/custom.css" | relative_url }}" />
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="nav-home" href="{{ "/" | relative_url }}">
        <img src="{{ "/assets/hlx_logo.png" | relative_url }}" alt="HealthLX" class="nav-logo" />
        <span class="nav-divider"></span>
        <img src="{{ "/assets/TG_logo.png" | relative_url }}" alt="TG" class="nav-logo-tg" />
      </a>
      <ul class="nav-links">
        <li><a href="{{ "Clinical_V4.2_Guide.html" | relative_url }}">Clinical</a></li>
        <li><a href="{{ "EOB_V6.0_Guide.html" | relative_url }}">EOB</a></li>
        <li><a href="{{ "Formulary_V6.2_Guide.html" | relative_url }}">Formulary</a></li>
        <li><a href="{{ "Insurance_V4.1_Guide.html" | relative_url }}">Insurance</a></li>
        <li><a href="{{ "ProviderDirectory_V4.3_Guide.html" | relative_url }}">Provider Directory</a></li>
        <li><a href="{{ "Roster_V6.2_Guide.html" | relative_url }}">Roster</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      &copy; {{ "now" | date: "%Y" }}
      <a href="https://healthlx.com" target="_blank" rel="noopener">HealthLX</a>
      &mdash; Client Schema Documentation Portal
    </p>
  </footer>

  {% unless page.url == "/" %}
  <button class="pdf-print-btn" onclick="window.print()" title="Export to PDF">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="6 9 6 2 18 2 18 9"></polyline>
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
      <rect x="6" y="14" width="12" height="8"></rect>
    </svg>
    Export to PDF
  </button>
  {% endunless %}
</body>
</html>
